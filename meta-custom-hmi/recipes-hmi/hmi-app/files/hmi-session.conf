# MarknStamp HMI Session Configuration
#
# HOW TO RUN YOUR OWN APPLICATION:
# Option 1 (Recommended): Run helper command: set-hmi-app /path/to/your_binary
# Option 2: Copy your executable to /opt/hmi/bin/app: cp my_app /opt/hmi/bin/app && chmod +x /opt/hmi/bin/app
# Option 3: Change APP_EXEC below to point to your custom binary path.
#
# After changing the binary, restart the HMI session: systemctl restart hmi-app
#
APP_EXEC="/opt/hmi/bin/app"
APP_ARGS=""
APP_USER="root"
APP_PLATFORM="linuxfb:fb=/dev/fb0"
APP_EXTRA_ENV="QT_QPA_GENERIC_PLUGINS=evdevtouch:/dev/input/touchscreen0 QT_QPA_EVDEV_TOUCHSCREEN_PARAMETERS=/dev/input/touchscreen0 QT_QPA_FONTDIR=/usr/share/fonts/truetype"
