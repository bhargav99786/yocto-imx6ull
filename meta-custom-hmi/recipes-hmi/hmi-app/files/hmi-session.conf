# MarknStamp HMI Session Configuration
# To run your own application, simply replace /opt/hmi/bin/app with your binary,
# or change APP_EXEC below to point to your application.

APP_EXEC="/opt/hmi/bin/app"
APP_ARGS=""
APP_USER="root"
APP_PLATFORM="linuxfb:fb=/dev/fb0"
APP_EXTRA_ENV="QT_QPA_GENERIC_PLUGINS=tslib:/dev/input/touchscreen0 TSLIB_TSDEVICE=/dev/input/touchscreen0 TSLIB_CALIBFILE=/etc/pointercal TSLIB_CONFFILE=/etc/ts.conf TSLIB_PLUGINDIR=/usr/lib/ts QT_QPA_FONTDIR=/usr/share/fonts/ttf"
