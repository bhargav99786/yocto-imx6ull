CONFIG_BOOTDELAY=2
CONFIG_SYS_MMC_ENV_DEV=0
CONFIG_USE_BOOTCOMMAND=y
CONFIG_BOOTCOMMAND="setenv mmcdev 0; setenv fdt_file okmx6ull-c-emmc.dtb; setenv mmcroot '/dev/mmcblk0p2 rootwait rw'; mmc dev 0; if mmc rescan; then if run loadbootscript; then run bootscript; else if run loadimage; then run mmcboot; else run netboot; fi; fi; else run netboot; fi"

CONFIG_CMD_BMP=y
CONFIG_DM_VIDEO=y
CONFIG_VIDEO_MXS=y
CONFIG_SYS_WHITE_ON_BLACK=y
CONFIG_VIDEO_BMP_RLE8=y
CONFIG_BMP_16BPP=y
CONFIG_BMP_24BPP=y
CONFIG_BMP_32BPP=y
