# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-custom-hmi"
BBFILE_PATTERN_meta-custom-hmi = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-custom-hmi = "10"

LAYERVERSION_meta-custom-hmi = "1"
LAYERSERIES_COMPAT_meta-custom-hmi = "kirkstone"

# Layer dependencies
LAYERDEPENDS_meta-custom-hmi = "core openembedded-layer freescale-layer qt5-layer"
